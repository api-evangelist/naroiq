name: NaroIQ
description: >-
  NaroIQ is a European ETF issuance and infrastructure platform that lets capital
  management companies and ETF initiators launch and operate their own
  exchange-traded funds while retaining control over their value chain. It acts as
  a single coordination layer across the full ETF lifecycle — fund setup, basket and
  portfolio composition file (PCF) management, intraday indicative net asset value
  (iNAV) calculation, an in-house indexing engine, optional portfolio management, and
  end-to-end regulatory compliance under Germany's BaFin and the EU's ESMA regimes.
  The company is a General Catalyst portfolio company based in Europe. As of this
  enrichment pass NaroIQ publishes no public API, SDK, developer portal, or machine
  discovery surface (no /.well-known/*, no llms.txt); this profile captures the
  company identity and published web properties.
